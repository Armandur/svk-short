name: Build & Push Docker image

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Krävs för nyckellös signering: cosign byter GitHubs kortlivade
      # OIDC-token mot ett certifikat hos Fulcio. Ingen signeringsnyckel
      # lagras någonstans, varken här eller på servern.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # Only login when pushing (not on PR from forks)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # main branch → :latest + semver release tags
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Semantic version tags from git tags (v1.2.3 → 1.2.3, 1.2, 1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            # Branch name tag for all other branches (slashes → dashes)
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            # Short SHA always
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Signera bara det som faktiskt hamnar i drift. Grenbyggen och
      # PR-byggen får ingen signatur, och kan därför inte heller passera
      # serverns kontroll - vilket är meningen.
      - name: Install cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3

      # github.repository bär ägarens versaler (Armandur/svky.se), men en
      # OCI-referens måste vara gemen. metadata-action gemenar åt taggarna,
      # egna rader gör det inte - cosign föll på "could not parse reference".
      # IDENTITETEN nedan ska däremot behålla versalerna: certifikatet är
      # utställt på repots riktiga namn.
      - name: Sign the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          IMAGE=$(echo "$IMAGE_REF" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "${IMAGE}@${DIGEST}"

      # Verifiera direkt. Inte för att CI ska intyga åt sig självt - det är
      # värdelöst som grind, och servern gör om kontrollen - utan för att en
      # trasig signering annars upptäcks först vid en deploy, långt från
      # orsaken.
      - name: Verify the signature
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          IMAGE=$(echo "$IMAGE_REF" | tr '[:upper:]' '[:lower:]')
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity \
              "https://github.com/${{ github.repository }}/.github/workflows/docker.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
