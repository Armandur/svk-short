services:
  svky:
    # Sätt SVKY_IMAGE till en digest när du vill veta exakt vad som körs:
    #   SVKY_IMAGE=ghcr.io/armandur/svky.se@sha256:<digest>
    # :latest är rörlig - två servrar som båda "kör latest" kan köra olika
    # kod, och efterhandsfrågan "vilken version gick sönder" saknar då svar.
    # Digesten är dessutom vad en promotion från staging ska bära vidare, se
    # docs/staging.md. Förvalet är kvar så en vanlig deploy fungerar som förut.
    image: ${SVKY_IMAGE:-ghcr.io/armandur/svky.se:latest}
    volumes:
      - ./data:/app/data
    env_file: .env
    environment:
      # Utan detta litar uvicorn bara på X-Forwarded-For från 127.0.0.1. Caddy
      # når appen från containernätets adress, så alla besökare hade räknats som
      # samma klient och delat rate limit-hink. Värdet förutsätter att svky
      # INTE publicerar någon port utåt - tjänsten nås bara via caddy i det
      # interna nätet, som sätter X-Forwarded-For själv.
      FORWARDED_ALLOW_IPS: "*"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - svky

volumes:
  caddy_data:
  caddy_config:
