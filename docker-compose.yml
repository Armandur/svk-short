services:
  svky:
    # SVKY_IMAGE måste stå i .env, som en digest:
    #   SVKY_IMAGE=ghcr.io/armandur/svky.se@sha256:<digest>
    #
    # Obligatorisk, inte "gärna". :latest är rörlig, och två saker följer av
    # det. Frågan "vilken version gick sönder" saknar svar i efterhand. Och en
    # signaturkontroll mot en tagg går att gå förbi utan att någon ljuger:
    # verifieringen gäller vad taggen pekade på då, medan pull hämtar vad den
    # pekar på nu.
    #
    # Compose läser .env av sig själv, så inget --env-file behövs här. Saknas
    # värdet faller kommandot vid inläsningen, INNAN något ändras.
    image: ${SVKY_IMAGE:?sätt SVKY_IMAGE i .env, se docs/staging.md}
    volumes:
      - ./data:/app/data
    env_file: .env
    environment:
      # Utan detta litar uvicorn bara på X-Forwarded-For från 127.0.0.1. Caddy
      # når appen från containernätets adress, så alla besökare hade räknats som
      # samma klient och delat rate limit-hink. Värdet förutsätter att svky
      # INTE publicerar någon port utåt - tjänsten nås bara via caddy i det
      # interna nätet, som sätter X-Forwarded-For själv.
      FORWARDED_ALLOW_IPS: "*"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - svky

volumes:
  caddy_data:
  caddy_config:
